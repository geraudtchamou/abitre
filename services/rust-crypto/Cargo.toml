[package]
name = "rust-crypto"
version = "0.1.0"
edition = "2021"
description = "High-performance cryptographic utilities for TrustEscrow platform"

[dependencies]
# Cryptography
argon2 = "0.5"
bcrypt = "0.15"
aes-gcm = "0.10"
rand = "0.8"
hex = "0.4"
base64 = "0.21"

# JWT
jsonwebtoken = "9"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.0", features = ["v4", "serde"] }

[lib]
name = "rust_crypto"
path = "src/lib.rs"

[[bin]]
name = "crypto-server"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
strip = true
