apiVersion: v1
kind: Secret
metadata:
  name: trustescrow-secrets
  namespace: trustescrow
type: Opaque
stringData:
  # Database Credentials
  DATABASE_USER: "trustescrow_admin"
  DATABASE_PASSWORD: "CHANGE_ME_SECURE_DB_PASSWORD"
  
  # JWT Configuration
  JWT_SECRET: "CHANGE_ME_SECURE_JWT_SECRET_MIN_32_CHARS"
  JWT_REFRESH_SECRET: "CHANGE_ME_SECURE_REFRESH_SECRET_MIN_32_CHARS"
  
  # Encryption Keys
  ENCRYPTION_KEY: "CHANGE_ME_32_BYTE_ENCRYPTION_KEY!!"
  
  # External Services
  STRIPE_SECRET_KEY: "sk_live_CHANGE_ME"
  STRIPE_WEBHOOK_SECRET: "whsec_CHANGE_ME"
  PAYPAL_CLIENT_ID: "CHANGE_ME"
  PAYPAL_CLIENT_SECRET: "CHANGE_ME"
  
  # Communication Services
  TWILIO_ACCOUNT_SID: "CHANGE_ME"
  TWILIO_AUTH_TOKEN: "CHANGE_ME"
  TWILIO_PHONE_NUMBER: "+1234567890"
  
  SENDGRID_API_KEY: "SG.CHANGE_ME"
  
  # OAuth Credentials
  GOOGLE_CLIENT_ID: "CHANGE_ME.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "CHANGE_ME"
  
  GITHUB_CLIENT_ID: "CHANGE_ME"
  GITHUB_CLIENT_SECRET: "CHANGE_ME"
  
  # AWS S3 for File Storage
  AWS_ACCESS_KEY_ID: "CHANGE_ME"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME"
  AWS_S3_BUCKET: "trustescrow-files"
  AWS_REGION: "us-east-1"
  
  # AI Service
  OPENAI_API_KEY: "sk-CHANGE_ME"
  
  # Monitoring
  SENTRY_DSN: "https://CHANGE_ME@sentry.io/CHANGE_ME"
