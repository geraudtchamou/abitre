apiVersion: v1
kind: ConfigMap
metadata:
  name: trustescrow-config
  namespace: trustescrow
data:
  # Backend Configuration
  NODE_ENV: "production"
  PORT: "5000"
  DATABASE_HOST: "postgres-service"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "trustescrow"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  
  # Service URLs
  RUST_CRYPTO_URL: "http://rust-crypto-service:3001"
  AI_FRAUD_URL: "http://ai-fraud-service:5001"
  
  # Frontend Configuration
  REACT_APP_API_URL: "/api"
  REACT_APP_WS_URL: "wss://trustescrow.example.com"
  
  # Application Settings
  MAX_FILE_SIZE: "52428800"
  ESCROW_FEE_PERCENTAGE: "2.5"
  ARBITRATION_FEE: "100"
  AUTO_RELEASE_DAYS: "14"
  
  # Logging
  LOG_LEVEL: "info"
  ENABLE_AUDIT_LOGS: "true"
  
  # Rate Limiting
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
